<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · 抽奖系统</title>
<style>
  :root {
    --bg: #070a15;
    --gold: #ffcb5c;
    --gold-deep: #f0a92e;
    --text: #eef2ff;
    --muted: #8b95bb;
    --border: rgba(255, 255, 255, 0.1);
    --red: #ff6b6b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 700px at 12% -10%, #1a1240 0%, transparent 60%),
                radial-gradient(1000px 600px at 92% 0%, #0b2b3d 0%, transparent 55%),
                linear-gradient(180deg, var(--bg) 0%, #05070f 100%);
    color: var(--text);
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.5;
    pointer-events: none;
  }
  .glow-a {
    width: 460px; height: 460px;
    top: -160px; left: -120px;
    background: #7b61ff;
  }
  .glow-b {
    width: 420px; height: 420px;
    right: -140px; bottom: -160px;
    background: #ff5c8a;
    opacity: 0.32;
  }

  .login-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 380px;
    padding: 40px 34px 30px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid var(--border);
    border-radius: 22px;
    backdrop-filter: blur(16px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    font-size: 40px;
    line-height: 1;
    text-align: center;
    filter: drop-shadow(0 6px 18px rgba(255, 203, 92, 0.35));
  }

  h1 {
    margin: 14px 0 6px;
    font-size: 24px;
    letter-spacing: 2px;
    text-align: center;
    background: linear-gradient(135deg, #fff, var(--gold) 60%, var(--gold-deep));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    margin: 0 0 28px;
    text-align: center;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--muted);
  }

  label {
    display: block;
    margin-bottom: 16px;
  }

  label > span {
    display: block;
    margin-bottom: 7px;
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }

  input::placeholder { color: #5a6488; }

  input:focus {
    border-color: rgba(255, 203, 92, 0.55);
    background: rgba(255, 255, 255, 0.075);
    box-shadow: 0 0 0 3px rgba(255, 203, 92, 0.12);
  }

  .pwd { position: relative; }
  .pwd input { padding-right: 46px; }

  .eye {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    font-size: 15px;
    background: transparent;
    border: 0;
    border-radius: 9px;
    cursor: pointer;
    opacity: 0.65;
    transition: opacity 0.2s, background 0.2s;
  }
  .eye:hover { opacity: 1; background: rgba(255, 255, 255, 0.07); }

  .err {
    min-height: 20px;
    margin: 2px 0 10px;
    font-size: 13px;
    color: var(--red);
    text-align: center;
  }

  .submit {
    width: 100%;
    height: 46px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 4px;
    color: #2a1a00;
    background: linear-gradient(135deg, #ffd77f, var(--gold), var(--gold-deep));
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(240, 169, 46, 0.28);
    transition: transform 0.16s, box-shadow 0.16s, filter 0.16s;
  }

  .submit:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 14px 32px rgba(240, 169, 46, 0.36);
    filter: brightness(1.04);
  }
  .submit:active:not(:disabled) { transform: translateY(0); }
  .submit:disabled {
    cursor: not-allowed;
    filter: grayscale(0.35);
    opacity: 0.75;
    letter-spacing: 1px;
  }

  .foot {
    margin: 22px 0 0;
    text-align: center;
    font-size: 12px;
    color: #5a6488;
  }

  @media (max-width: 420px) {
    .login-card { padding: 32px 24px 24px; }
  }
</style>
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <main class="login-card">
    <div class="logo">🎊</div>
    <h1>抽奖系统</h1>
    <p class="sub">公平 · 公开 · 可追溯</p>

    <form id="loginForm" autocomplete="off">
      <label>
        <span>账号</span>
        <input id="username" type="text" placeholder="请输入账号" autocomplete="username" required />
      </label>

      <label>
        <span>密码</span>
        <div class="pwd">
          <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" required />
          <button type="button" class="eye" id="togglePwd" aria-label="显示密码" tabindex="-1">👁</button>
        </div>
      </label>

      <div class="err" id="err"></div>
      <button type="submit" class="submit" id="submitBtn">登 录</button>
    </form>

    <p class="foot">登录后 7 天内免登录</p>
  </main>

<script>
  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('err');
  const btn = document.getElementById('submitBtn');
  const pwd = document.getElementById('password');
  const toggle = document.getElementById('togglePwd');

  toggle.addEventListener('click', () => {
    const hidden = pwd.type === 'password';
    pwd.type = hidden ? 'text' : 'password';
    toggle.textContent = hidden ? '🙈' : '👁';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.textContent = '';
    btn.disabled = true;
    btn.textContent = '登录中...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: pwd.value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '登录失败');
      location.href = '/';
    } catch (err) {
      errBox.textContent = err.message;
      btn.disabled = false;
      btn.textContent = '登 录';
      pwd.select();
    }
  });

  document.getElementById('username').focus();
</script>
</body>
</html>
