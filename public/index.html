<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#070a15" />
<title>抽奖 · 幸运时刻</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="app">
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-logo">🎊</span>
    <div>
      <h1>抽奖系统</h1>
      <p>公平 · 公开 · 可追溯</p>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="draw">抽奖</button>
    <button class="tab" data-view="records">中奖记录</button>
  </nav>
  <div class="header-links">
    <a class="top-link" href="/display.html" target="_blank" rel="noopener">公共大屏 ↗</a>
    <a class="top-link" href="/admin">管理后台</a>
  </div>
</header>

<main class="main">

  <!-- ============================ 抽奖台 ============================ -->
  <section class="view" id="view-draw">
    <div class="draw-grid">
      <aside class="card prize-panel">
        <div class="card-head">
          <h2>奖品池</h2>
          <span class="muted">点选一个奖品</span>
        </div>
        <div id="prizeList" class="prize-list"></div>
      </aside>

      <section class="card stage">
        <div class="stage-top">
          <div class="stage-prize">
            <span class="stage-icon" id="stageIcon">🎁</span>
            <div>
              <h2 id="stagePrizeName">请选择奖品</h2>
              <p id="stagePrizeMeta" class="muted">准备好名单后即可开抽</p>
            </div>
          </div>
          <div class="stage-counter">
            <span id="poolCount">0</span>
            <small>人参与本轮</small>
          </div>
        </div>

        <div class="roller-wrap">
          <div class="roller" id="roller">
            <span class="roller-name" id="rollName">🎯</span>
            <span class="roller-dept" id="rollDept"></span>
          </div>
          <div class="roller-tip" id="rollTip">点击下方按钮开始抽奖</div>
        </div>

        <div class="stage-bottom">
          <button class="btn-draw" id="drawBtn">
            <span>开 始 抽 奖</span>
          </button>
          <div class="stage-links">
            <a class="link" href="/display.html" target="_blank" rel="noopener">投屏到公共大屏</a>
            <span class="dot">·</span>
            <span class="muted">结果由服务器加密随机产生</span>
          </div>
        </div>
      </section>

      <aside class="card side-panel">
        <div class="stat-grid" id="statGrid">
          <div class="stat"><b id="statPeople">0</b><span>参与人数</span></div>
          <div class="stat"><b id="statWinners">0</b><span>已中奖</span></div>
          <div class="stat"><b id="statStock">0</b><span>剩余奖品</span></div>
          <div class="stat"><b id="statTotal">0</b><span>奖品总数</span></div>
        </div>
        <div class="card-head">
          <h2>实时中奖榜</h2>
          <span class="live-dot" title="实时同步"><i></i>LIVE</span>
        </div>
        <ul class="feed" id="feed"></ul>
      </aside>
    </div>
  </section>

  <!-- ============================ 中奖记录（只读） ============================ -->
  <section class="view hidden" id="view-records">
    <div class="card">
      <div class="card-head">
        <h2>中奖记录</h2>
        <div class="head-tools">
          <input id="recordSearch" class="input-sm" placeholder="搜索姓名 / 奖品 / 部门" />
        </div>
      </div>
      <div class="table-wrap">
        <table class="table" id="recordTable">
          <thead>
            <tr><th style="width:60px">#</th><th style="width:180px">中奖时间</th><th>奖品</th><th>奖项</th><th>姓名</th><th>部门</th><th style="width:120px">记录指纹</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<script src="/draw.js"></script>
</body>
</html>
