# 抽奖系统反向代理配置
# 放到 /etc/nginx/conf.d/lucky-draw.conf 或 sites-available 下
#
# 重要：这个应用本身没有任何登录校验，任何能访问到它的人
# 都可以改奖品、清空名单、执行抽奖。所以公网部署必须加一层访问控制，
# 下面默认开启 HTTP Basic 认证。

upstream lucky_draw {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 抽奖系统没有文件上传，请求体给 2m 足够，避免被大包打满
    client_max_body_size 2m;

    # --- 访问控制：整站需要密码 ---
    # 密码文件由 install-server.sh 自动生成，查看方式：
    #   sudo cat /opt/lucky-draw/deploy/.access.txt
    auth_basic "Lucky Draw";
    auth_basic_user_file /etc/nginx/.htpasswd-lucky;

    # 公共大屏通常是会议室投屏，输入一次密码后浏览器会记住
    # 如果希望大屏完全免密，把下面这段的注释去掉，并删掉上面的两行 auth_basic
    #
    # location = /display.html {
    #     auth_basic off;
    #     proxy_pass http://lucky_draw;
    # }

    # --- 静态资源：交给浏览器缓存，减少后端压力 ---
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        proxy_pass http://lucky_draw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- 其余请求（页面 + API） ---
    location / {
        proxy_pass http://lucky_draw;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 大屏每 2 秒轮询一次状态，关掉响应缓冲让数据立刻到达
        proxy_buffering off;
    }

    access_log /var/log/nginx/lucky-draw.access.log;
    error_log  /var/log/nginx/lucky-draw.error.log;
}
