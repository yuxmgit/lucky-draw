# 抽奖系统反向代理配置
# 放到 /etc/nginx/conf.d/lucky-draw.conf 或 sites-available 下
#
# 访问模型：
#   /             公开抽奖页，任何人都能打开（只能抽奖与查看结果）
#   /display.html 公开大屏，适合直接投屏
#   /admin        管理后台，由应用自带登录页（/login）保护
#   管理类接口（奖品 / 名单 / 重置等）在应用层校验会话，外部拿不到
#
# 因此默认不在 Nginx 层加整站密码，否则参与者也会被拦在抽奖页外。
# 需要额外一层防护时，把下面 server 块里的 auth_basic 两行取消注释即可。

upstream lucky_draw {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 抽奖系统没有文件上传，请求体给 2m 足够，避免被大包打满
    client_max_body_size 2m;

    # --- 访问控制（可选）：只给管理后台加一道 Basic Auth ---
    # 密码文件由 install-server.sh 生成，查看方式：
    #   sudo cat /opt/lucky-draw/deploy/.access.txt
    # 注意：取消注释后，管理员每次进后台要额外输一次浏览器密码框。
    #
    # location = /admin {
    #     auth_basic "Lucky Draw Admin";
    #     auth_basic_user_file /etc/nginx/.htpasswd-lucky;
    #     proxy_pass http://lucky_draw;
    #     proxy_set_header Host $host;
    # }

    # --- 静态资源：交给浏览器缓存，减少后端压力 ---
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        proxy_pass http://lucky_draw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- 其余请求（页面 + API） ---
    location / {
        proxy_pass http://lucky_draw;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 大屏每 2 秒轮询一次状态，关掉响应缓冲让数据立刻到达
        proxy_buffering off;
    }

    access_log /var/log/nginx/lucky-draw.access.log;
    error_log  /var/log/nginx/lucky-draw.error.log;
}
